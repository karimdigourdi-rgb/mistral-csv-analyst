name: extract-catalogue

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Extraction du catalogue (liste + détails)
        run: python scripts/extract_catalogue.py
      - name: Publication de l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: formations-management-master
          path: resultats/
          if-no-files-found: error
          retention-days: 30
